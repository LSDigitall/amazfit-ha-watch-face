name: Build Watchface

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona o repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Instala Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ Instala dependências
      - name: Install dependencies
        run: npm install

      # 4️⃣ Executa build
      - name: Build Watchface
        run: npm run build

      # 5️⃣ Guarda o resultado como artefacto
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchface-build
          path: dist/
